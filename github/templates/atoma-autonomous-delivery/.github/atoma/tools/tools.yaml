# Tools configuration for Atoma GitHub templates

filesystem:
  command: npx
  args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
  env: {}
  hooks:
    tool_denylist:
      - "filesystem__directory_tree"
      - "filesystem__search_files"

filesystem_readonly:
  command: npx
  args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
  env: {}
  hooks:
    tool_allowlist:
      - "filesystem_readonly__read_file"
      - "filesystem_readonly__read_multiple_files"
      - "filesystem_readonly__list_directory"
      - "filesystem_readonly__get_file_info"

shell:
  command: npx
  args: ["-y", "mcp-shell-server", "."]
  env: {}
  hooks:
    before_tool: ./scripts/shell_guard.py

github:
  command: docker
  args:
    - run
    - -i
    - --rm
    - -e
    - GITHUB_PERSONAL_ACCESS_TOKEN
    - ghcr.io/github/github-mcp-server
  env: {}
  hooks:
    tool_allowlist:
      - "github__search_issues"
      - "github__get_issue"
      - "github__list_issues"
      - "github__get_pull_request"
      - "github__list_pull_requests"
      - "github__get_pull_request_diff"
      - "github__list_commits"
      - "github__search_code"
      - "github__get_repo"
      - "github__get_branch"
      - "github__list_branches"
      - "github__get_check_runs"
      - "github__list_check_runs_for_ref"
      - "github__get_pull_request_reviews"
      - "github__list_pull_request_review_comments"
      - "github__get_issue_comments"
      - "github__list_workflow_runs"
      - "github__get_workflow_run"
