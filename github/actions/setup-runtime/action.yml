name: 'Atoma – Setup Runtime'
description: >
  Prepare local .github/atoma tool scripts and install shared runtime dependencies.

inputs:
  tools_file:
    description: 'Path to the local tools.yaml file'
    required: false
    default: '.github/atoma/tools/tools.yaml'

  scripts_dir:
    description: 'Path to the local tool scripts directory'
    required: false
    default: '.github/atoma/tools/scripts'

runs:
  using: 'composite'
  steps:
    - name: Prepare local tool scripts
      shell: bash
      run: |
        SCRIPTS_DIR="${{ inputs.scripts_dir }}"
        if [ -d "$SCRIPTS_DIR" ]; then
          find "$SCRIPTS_DIR" -maxdepth 1 -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} +
          echo "$GITHUB_WORKSPACE/$SCRIPTS_DIR" >> "$GITHUB_PATH"
        fi

    - name: Restore npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-mcp-${{ runner.os }}-${{ hashFiles(inputs.tools_file) }}
        restore-keys: |
          npm-mcp-${{ runner.os }}-

    - name: Pre-install MCP servers
      shell: bash
      run: |
        if [ ! -f "${{ inputs.tools_file }}" ]; then
          echo "::notice::No tools file found at ${{ inputs.tools_file }}; skipping MCP preinstall"
          exit 0
        fi

        npm install --no-save \
          @modelcontextprotocol/server-filesystem@latest \
          mcp-shell@latest