name: 'Atoma v4 – Run'
description: >
  Install the Atoma CLI and run an agent against the cached agent session plus
  the per-run shared GitHub context-session built by the prepare action.
author: 'yuma-seno'

branding:
  icon: 'cpu'
  color: 'purple'

# ── Inputs ────────────────────────────────────────────────────────────────
inputs:
  agent_name:
    description: 'Name of the agent (must match a .md file in agent_def_dir)'
    required: true

  agent_def_dir:
    description: 'Directory containing agent definition .md files'
    required: false
    default: '.github/atoma/agent-definitions'

  tools_file:
    description: 'Path to tools.yaml'
    required: false
    default: '.github/atoma/tools/tools.yaml'

  orchestration_file:
    description: 'Path to orchestration JSON config'
    required: false
    default: '.github/atoma/orchestration.json'

  openai_api_key:
    description: 'API key for the OpenAI-compatible LLM endpoint (required when using OpenAI/OpenRouter)'
    required: false
    default: ''

  openai_base_url:
    description: 'Custom OpenAI-compatible API base URL'
    required: false
    default: ''

  anthropic_api_key:
    description: 'API key for Anthropic (Claude) models (required when using Anthropic provider)'
    required: false
    default: ''

  atoma_provider:
    description: >
      Force a specific LLM provider: openai, github-copilot, or anthropic.
      When empty, Atoma auto-detects from available API keys.
      Equivalent to setting ATOMA_PROVIDER env var.
    required: false
    default: ''

  max_iterations:
    description: 'Maximum number of LLM inference iterations per run'
    required: false
    default: '50'

  atoma_version:
    description: 'Atoma CLI version tag to install, or `source` to build from the checked-out action repository'
    required: false
    default: 'v0.1.0'  # auto-updated by release workflow

  after_iteration_hook:
    description: >
      Path to an executable invoked after each tool-call batch.
      Non-empty stdout is appended as a user message.
    required: false
    default: ''

  github_token:
    description: >
      GitHub Personal Access Token with the `copilot` scope.
      Required when atoma_provider is set to "github-copilot".
      When using OpenAI/OpenRouter, the auto-generated GITHUB_TOKEN is sufficient.
      Exposed to Atoma as ATOMA_COPILOT_TOKEN.
    required: false
    default: ''

  issue_number:
    description: >
      Issue number associated with this run.
      Passed to create_pr as ISSUE_NUMBER so the created PR links back to the issue.
    required: false
    default: ''

# ── Outputs ───────────────────────────────────────────────────────────────
outputs:
  result:
    description: 'The final text response from the agent'
    value: ${{ steps.run-atoma.outputs.result }}

  directive:
    description: >
      The directive extracted from the first command-like line of the agent output.
      For example, if the output contains a line "/reviewer", this is "reviewer".
      Empty if no directive was found.
    value: ${{ steps.run-atoma.outputs.directive }}

  max_iterations_reached:
    description: 'true if the agent hit the iteration limit'
    value: ${{ steps.run-atoma.outputs.max_iterations_reached }}

# ── Steps ─────────────────────────────────────────────────────────────────
runs:
  using: 'composite'
  steps:
    - name: Install Atoma CLI
      shell: bash
      run: |
        VERSION="${{ inputs.atoma_version }}"
        if [ "$VERSION" = "source" ]; then
          REPO_ROOT=$(cd "${{ github.action_path }}/../../.." && pwd)
          echo "Building Atoma from source at ${REPO_ROOT} ..."
          cargo install --path "$REPO_ROOT" --force --locked
        elif [ "$VERSION" = "latest" ]; then
          URL="https://github.com/yuma-seno/atoma/releases/latest/download/atoma-linux-x86_64"
          echo "Downloading Atoma ${VERSION} ..."
          curl -fsSL "$URL" -o /usr/local/bin/atoma
          chmod +x /usr/local/bin/atoma
        else
          URL="https://github.com/yuma-seno/atoma/releases/download/${VERSION}/atoma-linux-x86_64"
          echo "Downloading Atoma ${VERSION} ..."
          curl -fsSL "$URL" -o /usr/local/bin/atoma
          chmod +x /usr/local/bin/atoma
        fi
        atoma --version

    - name: Run Atoma
      id: run-atoma
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        ATOMA_COPILOT_TOKEN: ${{ inputs.github_token }}
      run: |
        AGENT="${{ inputs.agent_name }}"
        DEF_DIR="${{ inputs.agent_def_dir }}"
        ORCHESTRATION_FILE="${{ inputs.orchestration_file }}"

        TOOLS_ARG=""
        if [ -f "${{ inputs.tools_file }}" ]; then
          TOOLS_ARG="--tools-file ${{ inputs.tools_file }}"
        fi

        HOOK_ARG=""
        if [ -n "${{ inputs.after_iteration_hook }}" ]; then
          HOOK_ARG="--after-iteration-hook ${{ inputs.after_iteration_hook }}"
        fi

        if [ -n "${{ inputs.openai_api_key }}" ]; then
          export OPENAI_API_KEY="${{ inputs.openai_api_key }}"
        fi
        if [ -n "${{ inputs.openai_base_url }}" ]; then
          export OPENAI_BASE_URL="${{ inputs.openai_base_url }}"
        fi
        # Optional: Anthropic API key (only export when non-empty to avoid breaking auto-detection)
        if [ -n "${{ inputs.anthropic_api_key }}" ]; then
          export ANTHROPIC_API_KEY="${{ inputs.anthropic_api_key }}"
        fi
        # Optional: force a specific provider (only export when non-empty)
        if [ -n "${{ inputs.atoma_provider }}" ]; then
          export ATOMA_PROVIDER="${{ inputs.atoma_provider }}"
        fi

        # Override GH_TOKEN with user-provided PAT if supplied.
        # Only needed for the GitHub Copilot provider (requires `copilot` scope).
        # When using OpenAI/OpenRouter, the auto-generated GITHUB_TOKEN is sufficient.
        if [ -n "$ATOMA_COPILOT_TOKEN" ]; then
          export GH_TOKEN="$ATOMA_COPILOT_TOKEN"
          export GITHUB_PERSONAL_ACCESS_TOKEN="$ATOMA_COPILOT_TOKEN"
        fi

        if [ -f "$ORCHESTRATION_FILE" ]; then
          eval "$(python3 - "$ORCHESTRATION_FILE" <<'PY'
        import json
        import shlex
        import sys

        path = sys.argv[1]
        with open(path, encoding='utf-8') as f:
            config = json.load(f)

        def configured_value(mapping, key, default):
          if isinstance(mapping, dict) and key in mapping and mapping[key] is not None:
            return mapping[key]
          return default

        dispatch = config.get('dispatch') or {}
        scripts = config.get('scripts') or {}
        create_pr = scripts.get('create_pr') or {}
        push_commits = scripts.get('push_commits') or {}
        create_sub_issue = scripts.get('create_sub_issue') or {}

        env = {
          'ATOMA_DISPATCH_WORKFLOW': configured_value(dispatch, 'workflow', 'atoma-runner.yml'),
          'ATOMA_CREATE_PR_AGENT': configured_value(create_pr, 'dispatch_agent', 'reviewer'),
          'ATOMA_PUSH_COMMITS_AGENT': configured_value(push_commits, 'dispatch_agent', 'reviewer'),
          'ATOMA_SUB_ISSUE_NOTIFY_AGENT': configured_value(create_sub_issue, 'notify_agent', 'orchestrator'),
          'ATOMA_SUB_ISSUE_TRIGGER_AGENT': configured_value(create_sub_issue, 'trigger_agent', 'engineer'),
        }

        for key, value in env.items():
            print(f'export {key}={shlex.quote(str(value))}')
        PY
          )"
        fi

        CONTEXT_ARG=""
        if [ -f "context-session.json" ]; then
          CONTEXT_ARG="--context-session context-session.json"
        fi

        # Note: no --prompt-file. The cached session contains agent-local state
        # (assistant replies, tool calls, working memory), and context-session.json
        # supplies the current shared GitHub conversation for this run only.
        EXIT_CODE=0
        atoma run \
          --agent-def "${DEF_DIR}/${AGENT}.md" \
          --in-session session.json \
          --out-session session.json \
          --max-iterations ${{ inputs.max_iterations }} \
          ${CONTEXT_ARG} \
          ${TOOLS_ARG} \
          ${HOOK_ARG} \
          > atoma_output.txt 2> atoma_logs.txt || EXIT_CODE=$?

        echo "=== Atoma Logs ===" >&2
        cat atoma_logs.txt >&2

        if [ "$EXIT_CODE" = "2" ]; then
          echo "::notice::Max iterations reached — session saved for next run"
          echo "max_iterations_reached=true" >> "$GITHUB_OUTPUT"
        elif [ "$EXIT_CODE" != "0" ]; then
          exit $EXIT_CODE
        fi

        # Store multiline result as a step output.
        # Use a random delimiter to prevent early termination if the agent
        # output happens to contain the delimiter string on its own line.
        RESULT_EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
          echo "result<<${RESULT_EOF}"
          cat atoma_output.txt
          echo "${RESULT_EOF}"
        } >> "$GITHUB_OUTPUT"

        # Extract directive from the first command-like line.
        # Accept both "/engineer" (with optional args) and the common markdown-mangled form "/`engineer`".
        DIRECTIVE=$(python3 - <<'PY'
        import re
        from pathlib import Path

        command_pattern = re.compile(r'^/(?P<agent>[a-z][a-z0-9-]+)(?:\b|\s|$)')

        def candidates(raw: str) -> list[str]:
          line = raw.strip()
          if not line:
            return []

          line = re.sub(r'^(?:[-*+]\s+|>\s*)+', '', line)
          variants = [line]

          if line.startswith('`') and line.endswith('`') and len(line) > 2:
            variants.append(line[1:-1].strip())

          if line.startswith('/`') and line.endswith('`') and len(line) > 3:
            variants.append('/' + line[2:-1].strip())

          return variants

        for raw_line in Path('atoma_output.txt').read_text(encoding='utf-8').splitlines():
          for candidate in candidates(raw_line):
            match = command_pattern.match(candidate)
            if match:
              print(match.group('agent'))
              raise SystemExit(0)
        PY
        )
        echo "directive=${DIRECTIVE}" >> "$GITHUB_OUTPUT"

    - name: Write token usage summary
      if: ${{ always() && hashFiles('atoma_logs.txt') != '' }}
      shell: bash
      run: |
        USAGE_LINE=$(grep -m1 "ATOMA_TOKEN_USAGE:" atoma_logs.txt 2>/dev/null || true)
        if [ -z "$USAGE_LINE" ]; then
          exit 0
        fi
        PROMPT=$(echo "$USAGE_LINE"     | grep -oP 'prompt=\K[0-9]+')
        COMPLETION=$(echo "$USAGE_LINE" | grep -oP 'completion=\K[0-9]+')
        TOTAL=$(echo "$USAGE_LINE"      | grep -oP 'total=\K[0-9]+')
        {
          echo "## Atoma Token Usage"
          echo "| Agent | Prompt | Completion | Total |"
          echo "|------------|--------|------------|-------|"
          echo "| ${{ inputs.agent_name }} | ${PROMPT:-—} | ${COMPLETION:-—} | ${TOTAL:-—} |"
        } >> "$GITHUB_STEP_SUMMARY"
