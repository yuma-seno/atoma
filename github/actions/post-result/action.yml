name: 'Atoma – Post Result'
description: >
  Post the agent result as a GitHub comment, tag the session with the comment ID,
  record the shared context snapshot, save the session to the atoma-data branch,
  and report failures.
author: 'yuma-seno'

branding:
  icon: 'message-square'
  color: 'purple'

# ── Inputs ────────────────────────────────────────────────────────────────
inputs:
  agent_name:
    description: 'Current agent name'
    required: true

  number:
    description: 'Issue or PR number'
    required: true

  type:
    description: 'Context type: issue or pr'
    required: true

  notify:
    description: 'GitHub login to mention when the run completes without a directive'
    required: false
    default: ''

  job_status:
    description: 'Current job status (success / failure / cancelled)'
    required: true

  atoma_outcome:
    description: 'Outcome of the Atoma run step (success / failure / skipped)'
    required: false
    default: ''

  directive:
    description: 'Next agent directive extracted from the agent output'
    required: false
    default: ''

  chain_continues:
    description: >
      'true' when a tool call made during this run already triggered an
      automatic follow-up dispatch (launch_sub_agent, create_pr, merge_pr),
      independent of `directive`. When true, the "no agent will run, please
      review" notice is suppressed since the process is already continuing.
    required: false
    default: 'false'

  new_event_count:
    description: 'Number of new shared-context events for this run'
    required: false
    default: '0'

  max_iterations_reached:
    description: 'true when the agent hit the iteration limit'
    required: false
    default: 'false'

  context_snapshot_hash:
    description: 'Hash of the filtered shared GitHub context snapshot'
    required: false
    default: ''

  context_event_count:
    description: 'Number of messages written to context-session.json'
    required: false
    default: '0'

  resolved_number:
    description: 'Canonical number stored with the session metadata'
    required: false
    default: ''

# ── Outputs ───────────────────────────────────────────────────────────────
outputs:
  comment_id:
    description: 'GitHub comment ID created for the result comment'
    value: ${{ steps.post.outputs.comment_id }}

# ── Steps ─────────────────────────────────────────────────────────────────
runs:
  using: 'composite'
  steps:
    - name: Post result comment
      if: >-
        inputs.atoma_outcome == 'success' &&
        inputs.new_event_count != '0'
      id: post
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ inputs.number }}
        AGENT: ${{ inputs.agent_name }}
        NOTIFY: ${{ inputs.notify }}
        DIRECTIVE: ${{ inputs.directive }}
        CHAIN_CONTINUES: ${{ inputs.chain_continues }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        MAX_ITER: ${{ inputs.max_iterations_reached }}
      run: |
        {
          echo "<!-- atoma:agent=${AGENT} -->"
          cat atoma_output.txt
          echo ""

          # Append token usage if available
          if [ -f atoma_logs.txt ]; then
            USAGE=$(grep -m1 "ATOMA_TOKEN_USAGE:" atoma_logs.txt 2>/dev/null || true)
            if [ -n "$USAGE" ]; then
              PROMPT=$(echo "$USAGE"     | grep -oP 'prompt=\K[0-9]+')
              COMPLETION=$(echo "$USAGE" | grep -oP 'completion=\K[0-9]+')
              TOTAL=$(echo "$USAGE"      | grep -oP 'total=\K[0-9]+')
              echo ""
              echo "---"
              echo "_Tokens: ${TOTAL:-?} total (${PROMPT:-?} prompt + ${COMPLETION:-?} completion)_"
              if [ -n "$PROMPT" ] && [ -n "$COMPLETION" ]; then
                COST=$(awk "BEGIN { printf \"%.4f\", ${PROMPT} * 0.15 / 1000000 + ${COMPLETION} * 0.60 / 1000000 }" 2>/dev/null || true)
                if [ -n "$COST" ]; then
                  echo "_Estimated cost: \$${COST}_"
                fi
              fi
            fi
          fi

          if [ -z "$DIRECTIVE" ] && [ "$CHAIN_CONTINUES" != "true" ] && [ -n "$NOTIFY" ]; then
            echo "@${NOTIFY} — **${AGENT}** task completed. No agent will be automatically executed next. Please review the results or provide instructions for the next step."
            echo ""
          fi
          echo "---"
          echo "_run by [${AGENT}](${RUN_URL})_"
          [ "$MAX_ITER" = "true" ] && \
            echo "⚠️ _Max iterations reached. Comment \`/${AGENT}\` to continue._"
        } > _comment.txt

        python3 - <<'PY'
        import json
        from pathlib import Path

        body = Path("_comment.txt").read_text(encoding="utf-8")
        Path("_comment.json").write_text(
            json.dumps({"body": body}, ensure_ascii=False),
            encoding="utf-8",
        )
        PY

        COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" \
          --method POST \
          --input _comment.json \
          --jq '.id')
        rm -f _comment.json
        echo "comment_id=${COMMENT_ID}" >> "$GITHUB_OUTPUT"
        echo "Posted comment ID: ${COMMENT_ID}"

    - name: Add eyes reaction on agent handoff
      if: >-
        inputs.atoma_outcome == 'success' &&
        steps.post.outputs.comment_id != '' &&
        inputs.directive != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMENT_ID: ${{ steps.post.outputs.comment_id }}
      run: |
        gh api --method POST \
          "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
          -f content="eyes" 2>/dev/null || true

    - name: Tag session with comment ID
      if: >-
        inputs.atoma_outcome == 'success' &&
        steps.post.outputs.comment_id != ''
      shell: python3 {0}
      env:
        COMMENT_ID: ${{ steps.post.outputs.comment_id }}
        AGENT: ${{ inputs.agent_name }}
      run: |
        import json
        import os

        comment_id = int(os.environ["COMMENT_ID"])
        agent = os.environ["AGENT"]

        with open("session.json", encoding="utf-8") as f:
            session = json.load(f)

        for msg in reversed(session["messages"]):
            if msg["role"] == "assistant" and msg.get("content"):
                meta = msg.setdefault("atoma_metadata", {})
                meta["github_comment_id"] = comment_id
                meta["agent"] = agent
                break

        with open("session.json", "w", encoding="utf-8") as f:
            json.dump(session, f, indent=2, ensure_ascii=False)
            f.write("\n")

        print(f"Tagged last assistant message with github_comment_id={comment_id}")

    - name: Record shared context snapshot
      if: >-
        inputs.atoma_outcome == 'success' &&
        inputs.new_event_count != '0'
      shell: python3 {0}
      env:
        SNAPSHOT_HASH: ${{ inputs.context_snapshot_hash }}
        EVENT_COUNT: ${{ inputs.context_event_count }}
        AGENT: ${{ inputs.agent_name }}
        CONTEXT_TYPE: ${{ inputs.type }}
        RESOLVED_NUMBER: ${{ inputs.resolved_number }}
      run: |
        import json
        import os

        with open("session.json", encoding="utf-8") as f:
            session = json.load(f)

        metadata = session.get("metadata")
        if not isinstance(metadata, dict):
            metadata = {}

        metadata["github_context"] = {
            "snapshot_hash": os.environ["SNAPSHOT_HASH"],
            "event_count": int(os.environ.get("EVENT_COUNT") or "0"),
            "agent": os.environ["AGENT"],
            "type": os.environ["CONTEXT_TYPE"],
            "resolved_number": os.environ["RESOLVED_NUMBER"],
        }
        session["metadata"] = metadata

        with open("session.json", "w", encoding="utf-8") as f:
            json.dump(session, f, indent=2, ensure_ascii=False)
            f.write("\n")

        print(
            "Recorded shared context snapshot hash="
            f"{os.environ['SNAPSHOT_HASH']} for agent={os.environ['AGENT']}"
        )

    - name: Save session to atoma-data branch
      if: inputs.atoma_outcome == 'success'
      shell: bash
      env:
        TYPE: ${{ inputs.type }}
        NUMBER: ${{ inputs.number }}
        AGENT: ${{ inputs.agent_name }}
        RUN_ID: ${{ github.run_id }}
      run: |
        if [ ! -f session.json ]; then
          echo "No session.json found, skipping save."
          exit 0
        fi

        TARGET="sessions/${TYPE}-${NUMBER}-${AGENT}.json"
        SESSION_SRC="$(pwd)/session.json"

        # Ensure atoma-data branch exists; create orphan from empty tree if not.
        if ! git ls-remote --exit-code origin atoma-data > /dev/null 2>&1; then
          echo "Creating atoma-data orphan branch..."
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          # 4b825dc6... is Git's canonical empty-tree SHA (never changes)
          COMMIT=$(git commit-tree "4b825dc642cb6eb9a060e54bf8d69288fbee4904" \
            -m "init: atoma-data session store")
          git push origin "${COMMIT}:refs/heads/atoma-data"
          echo "Created atoma-data at ${COMMIT}"
        fi

        # Use a worktree so we don't disturb the current checkout.
        git fetch origin atoma-data
        git worktree add /tmp/atoma-data-wt origin/atoma-data

        pushd /tmp/atoma-data-wt
        git config user.email "action@github.com"
        git config user.name "GitHub Actions"

        # Parallel agents (e.g. sibling sub-issue engineers running at the same
        # time) each write to their own sessions/<type>-<number>-<agent>.json,
        # but all push to the SAME atoma-data branch, so a push race is
        # expected, not exceptional. Re-pull the latest tip immediately before
        # every commit attempt, and if the push still loses the race, hard-reset
        # onto the newest tip, re-apply our own file, and recommit from scratch
        # -- safe because we only ever touch our own uniquely-named file, so a
        # reset can never discard another agent's concurrently-pushed session.
        SAVED=false
        for attempt in 1 2 3 4 5; do
          git fetch origin atoma-data
          git reset --hard origin/atoma-data

          mkdir -p "$(dirname "${TARGET}")"
          cp "${SESSION_SRC}" "${TARGET}"
          git add "${TARGET}"

          if git diff --cached --quiet; then
            echo "Session unchanged, skipping commit."
            SAVED=true
            break
          fi

          git commit -m "session: ${AGENT} on ${TYPE} ${NUMBER} (run ${RUN_ID})"

          if git push origin HEAD:atoma-data; then
            echo "Session saved to atoma-data:${TARGET}"
            SAVED=true
            break
          fi

          echo "Push attempt ${attempt} failed (concurrent push by another agent) -- resetting and retrying with a fresh pull..."
          sleep $((attempt * 2))
        done

        if [ "$SAVED" != "true" ]; then
          echo "::warning::Failed to save session to atoma-data:${TARGET} after all retries."
        fi

        popd
        git worktree remove --force /tmp/atoma-data-wt

    - name: Report failure
      if: inputs.job_status != 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ inputs.number }}
        AGENT: ${{ inputs.agent_name }}
        NOTIFY: ${{ inputs.notify }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "$NUMBER" ]; then
          echo "::error::Cannot post failure comment: issue/PR number unknown."
          exit 0
        fi
        AGENT_LABEL="${AGENT:+${AGENT} }Atoma"
        ERR_MSG=""
        if [ -f atoma_logs.txt ]; then
          ERR_MSG=$(grep -iP 'error|fail|panic|exception|unauthorized' atoma_logs.txt | head -n 5 || true)
        fi
        MENTION=""
        if [ -n "$NOTIFY" ]; then
          MENTION="@${NOTIFY} - "
        fi
        BD=$(mktemp)
        echo "${MENTION}Warning: ${AGENT_LABEL} encountered an error." > "$BD"
        echo "Please check the reason and retry if necessary." >> "$BD"
        echo "Workflow logs: ${RUN_URL}" >> "$BD"
        if [ -n "$ERR_MSG" ]; then
          echo "" >> "$BD"
          echo "Error messages detected from logs (excerpt):" >> "$BD"
          printf '```\n' >> "$BD"
          echo "${ERR_MSG}" >> "$BD"
          printf '```\n' >> "$BD"
        fi
        gh issue comment "$NUMBER" --body-file "$BD"
        rm -f "$BD"
